<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		#logoContainer {
		    width: 180px;
		    height: 170px;
		    box-sizing: content-box;
		    padding-top: 15px;
		    position: relative;
		    background: red;
		    color: white;
		    font-size: 11px;
		    letter-spacing: 0.2em;
		    text-align: center;
		    text-transform: uppercase;
		  }
		  #logoContainer:after {
		    content: "";
		    position: absolute;
		    left: 0;
		    bottom: 0;
		    width: 0;
		    height: 0;
		    border-bottom: 25px solid #eee;
		    border-left: 90px solid transparent;
		    border-right: 90px solid transparent;
		  }

		  #logoContainer > img{
		  	width: 100%;
		  	height: auto;
		  }
	</style>
</head>
<body>

	<div id="logoContainer">
		<img src="img/logos/main-logo.png">
	</div>

</body>
</html>
